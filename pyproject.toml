[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "astrbot-plugin-steam-skin-ops"
version = "1.1.0"
description = "AstrBot plugin for Steam skin market monitoring"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0,<1",
  "pycryptodome>=3.20.0,<4",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0",
  "ruff>=0.12",
  'tomli>=2.0.1; python_version < "3.11"',
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
